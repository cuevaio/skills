name: validate skills
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public YouTube recording to acquire
        required: true
        type: string
      runner:
        description: Acquisition runner
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 requests==2.32.5 av==16.1.0 imageio-ffmpeg==0.6.0 yt-dlp==2026.9.27.232945.dev0
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests -v

  acquire:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_URL: ${{ inputs.video_url }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install requests==2.32.5 av==16.1.0 imageio-ffmpeg==0.6.0 yt-dlp==2026.9.27.232945.dev0
      - name: Acquire and verify public recording
        shell: bash
        run: python skills/content-production/youtube-remotion-clips/scripts/download_source.py "$SOURCE_URL" --workspace media --max-mirrors 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-acquisition
          retention-days: 1
          path: |
            media/source/audio.mka
            media/source/video.mp4
            media/source/acquisition.json
            media/source/yt-dlp-audio.log
            media/provenance.json
